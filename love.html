<!DOCTYPE html>
<html lang="en_US">
<head>
<title>WeiLin Baby</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="https://e7.pngegg.com/pngimages/742/937/png-clipart-heart-emoji-emoticon-symbol-broken-heart-love-heart.png">

<style>
	*{
	padding:0;
	margin:0;
	font-family: 'Pacifico';
}
	body{
	background: rgba(255, 105, 138, 0.3);
	display: flex;
	justify-content: center;
	align-items: center;
	height: 100vh;
	width: 100vw;
overflow: hidden;
}

	body > .main{
	border:2px solid rgba(255, 105, 138, 0.7);
	border-radius: 8px;
	width: 80vw;
	height: 30vh;
	font-size: 1rem;
	display: flex;
	flex-direction: column;
	align-items: center;
	padding-top: 10px;
	overflow: hidden;
	
	> div{
	margin-top: 50px;
	width: 100%;
	height: 10%;
	display: flex;
	justify-content: center;
}
}

	button{
	width: 20%;
	height: 100%;
	border: 2px solid red;
	border-radius: 10px;
	margin-right: 30px;
	background: rgba(200, 105, 138, 0.2);
	color: black;
}

	img{
	width: auto;
	height: 50%;
}

	.heart {
      position: absolute;
      font-size: 2em;
      animation: fall 3s linear infinite;
    }

    @keyframes fall {
      from {
        top: -5%;
        opacity: 1;
      }
      to {
        top: 100%;
        opacity: 0;
      }
    }

}
</style>
</head>
<body>
<div class="main">
	<span id="mytext">Hello bb, can you be my valentine?</span>
	<img id="myimage" src="https://i.imgflip.com/6xlbkw.jpg?a484776">
	<div>
	<button onclick="heartShower()">Yes 💓</button>
	<button onclick="changeText()">No 💔</button>
	</div>
</div>

<script>
const img = document.getElementById("myimage");
const txt = document.getElementById("mytext");
var counter = 0;
const texts = ["But me will bring u nice food!", "Just click yes please 🥺", "Are you sure you don't want?", "Is ok i am no sad 💔"];
const images = ["https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTvhcUjBOBUtSvlKHK-k8q3trSGaTvP43vJLkb8rtuUkA&s&ec=72940545", "https://is1-ssl.mzstatic.com/image/thumb/Purple116/v4/f2/f8/80/f2f8805b-f2ba-fa85-625f-b20d7fd7adda/iMessage_App_Icon-1x_U007emarketing-0-85-181-0.png/512x512bb.jpg","https://cdn-useast1.kapwing.com/static/templates/crying-cat-meme-template-full-719a53dc.webp", "https://i.imgflip.com/54o27s.png"];

function changeText(){
	txt.innerText = texts[counter%(texts.length)];
	img.src = images[counter%(texts.length)];
	counter++;
}

function heartShower(){
txt.innerText = "Yayyyyyyy!!!";
img.src = "https://i.makeagif.com/media/4-20-2023/lW_UFt.gif";
for(let i=0; i<100; i++){
      const heart = document.createElement('div');
      heart.classList.add('heart');
      heart.textContent = '❤️'; // You can change to other heart emojis or symbols

      // Set random position
	heart.style.top = -50 + "px";
      heart.style.left = Math.random() * 100 + 'vw';
      heart.style.animationDuration = Math.random() * 2 + 3 + 's'; // Random fall speed
	heart.style.animationDelay = Math.random() * 2 + 's';

      document.body.appendChild(heart);
// Remove heart after animation ends to clean up
      setTimeout(() => {
        heart.remove();
      }, 10000); // Remove after 5 seconds to match animation duration
}
      

      
}
</script>
</body>
</html>
